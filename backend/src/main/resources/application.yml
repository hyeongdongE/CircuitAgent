spring:
  application:
    name: circuitagent
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/circuitagent?useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:circuitagent}
    password: ${DB_PASSWORD:}
    hikari:
      data-source-properties:
        rewriteBatchedStatements: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  address: 127.0.0.1
circuitagent:
  mode: ${CIRCUITAGENT_MODE:local-poc}
