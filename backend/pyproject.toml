[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitagent"
version = "0.3.0"
description = "XLSX BOM and QCV netlist parsing and connectivity core"
requires-python = ">=3.11"
dependencies = ["pydantic==2.14.1", "openpyxl==3.1.5"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.17.0", "build==1.6.1"]

[project.scripts]
circuitagent-parse = "circuitagent.cli:main"

[tool.setuptools.packages.find]
include = ["circuitagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
