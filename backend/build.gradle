plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.circuitagent'
version = '0.1.0-SNAPSHOT'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }

// CSV/Excel 파싱은 검증된 라이브러리를 사용하고, MySQL 스키마는 Flyway가 관리한다.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

// 원본 재배포 조건이 확인되지 않은 공개 자료는 커밋하지 않는다. 체크섬이 고정된 6개 원본을 내려받은 뒤 변환한다.
def qcvFixtureDir = rootProject.file('../.local/qcv-fixtures')
tasks.register('convertQcvBoms', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.circuitagent.design.tools.CsvToXlsx'
    args qcvFixtureDir.absolutePath
    inputs.files(['fe', 'ntop', 'fe-ntop'].collect { new File(qcvFixtureDir, it + '.csv') })
    outputs.files(['fe', 'ntop', 'fe-ntop'].collect { new File(qcvFixtureDir, it + '.xlsx') })
}
tasks.named('test') {
    systemProperty 'qcv.fixture.dir', qcvFixtureDir.absolutePath
}
